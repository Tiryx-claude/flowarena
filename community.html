<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="meta.titles.community">FlowArena — Community</title>
  <meta name="description" content="FlowArena Community: veröffentlichte Takes ansehen, liken, Leute finden und die Rangliste checken." />
  <meta name="theme-color" content="#06060a" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23b537f5'/%3E%3Cstop offset='1' stop-color='%2329d3ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%2306060a'/%3E%3Ccircle cx='50' cy='50' r='30' fill='url(%23g)'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/community.css" />
  <link rel="stylesheet" href="assets/css/social.css" />
  <link rel="stylesheet" href="assets/css/ads.css" />
  <link rel="stylesheet" href="assets/css/i18n.css" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true"></div>

  <header class="nav">
    <div class="nav__brand">
      <span class="nav__logo" aria-hidden="true">🎤</span>
      <span>Flow<span class="nav__brand-name">Arena</span></span>
    </div>
    <nav class="nav__links" aria-label="Hauptnavigation">
      <a class="nav__link" href="index.html" data-i18n="nav.home">Home</a>
      <a class="nav__link" href="#" data-i18n="nav.challenges">Challenges</a>
      <a class="nav__link" href="#" data-i18n="nav.beats">Beats</a>
      <a class="nav__link" href="shop.html" data-i18n="nav.shop">Shop</a>
      <a class="nav__link" href="community.html" data-i18n="nav.community">Community</a>
    </nav>
    <div class="nav__actions">
      <span class="chip" style="cursor:default;"><span class="chip__dot"></span><span class="chip__label" data-i18n="common.credits">Credits</span><span class="chip__value" id="creditsValue">–</span></span>
      <div class="notif-wrap">
        <button class="btn-icon" id="notifBellBtn" type="button" data-i18n-attr="aria-label:common.notifications,title:common.notifications">🔔<span class="notif-badge" id="notifBadge" hidden>0</span></button>
        <div class="notif-dropdown" id="notifDropdown" hidden>
          <div class="notif-dropdown__head"><span data-i18n="common.notifications">Benachrichtigungen</span><button type="button" id="notifMarkReadBtn" data-i18n="common.markAllRead">Alle gelesen</button></div>
          <div class="notif-list" id="notifList"></div>
        </div>
      </div>
      <a class="btn-icon" href="profile.html" data-i18n-attr="aria-label:community.openProfile,title:community.profile" style="display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:1.1rem;" id="profileAvatarLink">🎤</a>
    </div>
  </header>

  <main class="page community-page">
    <h1 style="font-size:var(--fs-2xl); margin-bottom:var(--sp-2);" data-i18n="nav.community">Community</h1>
    <p style="color:var(--text-muted); font-size:var(--fs-sm); margin-bottom:var(--sp-6); max-width:560px;" data-i18n="community.introText">
      Veröffentlichte Takes, Leute finden, Rangliste checken — inklusive ein paar Beispiel-Personen, damit hier nicht
      gähnende Leere herrscht. Alles lebt lokal in deinem Browser, es gibt (noch) kein echtes Backend.
    </p>

    <div class="community-tabs" role="tablist">
      <button class="community-tabs__opt is-active" id="tabFeed" type="button" data-i18n="community.tabFeed">📰 Feed</button>
      <button class="community-tabs__opt" id="tabLeaderboard" type="button" data-i18n="community.tabLeaderboard">🏆 Rangliste</button>
      <button class="community-tabs__opt" id="tabSearch" type="button" data-i18n="community.tabSearch">🔍 Suche</button>
    </div>

    <section id="feedView">
      <div class="feed-list" id="feedList"></div>
    </section>

    <section id="leaderboardView" hidden>
      <div class="community-tabs" style="margin-bottom:var(--sp-4);">
        <button class="community-tabs__opt is-active" id="lbScopeAll" type="button" data-i18n="community.scopeAll">🌍 Alle</button>
        <button class="community-tabs__opt" id="lbScopeFriends" type="button" data-i18n="community.scopeFriends">👥 Nur Freunde</button>
      </div>
      <div id="leaderboardList"></div>
    </section>

    <section id="searchView" hidden>
      <input class="select search-input-row" id="peopleSearchInput" type="text" data-i18n-attr="placeholder:community.searchPlaceholder" placeholder="Namen suchen …" />
      <div class="person-list" id="searchResults"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/i18n-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/sound.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/profile-data.js"></script>
  <script src="assets/js/community-data.js"></script>
  <script src="assets/js/social-data.js"></script>
  <script src="assets/js/daily-rewards.js"></script>
  <script src="assets/js/community.js"></script>
  <script src="assets/js/notifications-ui.js"></script>
  <script src="assets/js/ads.js"></script>
</body>
</html>
